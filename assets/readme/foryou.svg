<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="How For you works. 1: your shows and what you play, on your computer: hours listened weigh more than just following. 2: their genres and subgenres, such as Tech News or Documentary, weighted by that. 3: Apple&#x27;s top chart for each of your top four, fetched at once and kept for 12 hours. 4: ranked: a show in several of your charts rises, shows that went quiet sink, no single genre takes over, and x hides a show for good. Your list of shows stays on your computer.">
<style>
@font-face{font-family:hm;font-weight:400;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:500;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:600;src:url(data:font/woff2;base64,)}
text{font-family:hm,hf,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<defs><marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b5b5b"/></marker></defs>
<rect x="0.00" y="0.00" width="880.00" height="280.00" rx="6" fill="#0d0d0d"/>
<rect x="0.50" y="0.50" width="879.00" height="279.00" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.50" y="26.50" width="831.00" height="227.00" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36.00" y="24.00" width="146.60" height="5.00" fill="#0d0d0d"/>
<text x="42.00" y="30.50" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start" xml:space="preserve">how For you works</text>
<rect x="535.80" y="24.00" width="309.20" height="5.00" fill="#0d0d0d"/>
<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">your list of shows stays on your computer</text>
<rect x="44.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="70.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="70.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">1</text>
<text x="60.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">What you play</text>
<text x="60.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your shows, and the hours</text>
<text x="60.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">you spend with each</text>
<path d="M225.0 124L244.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="249.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="275.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="275.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">2</text>
<text x="265.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Your genres</text>
<text x="265.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">down to subgenres like</text>
<text x="265.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">Tech News or Documentary</text>
<path d="M430.0 124L449.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="454.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<circle cx="480.0" cy="90" r="12" fill="#2a2a2a"/>
<text x="480.00" y="94.50" font-size="13" font-weight="600" fill="#ececec" text-anchor="middle" xml:space="preserve">3</text>
<text x="470.00" y="130.00" font-size="14" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Apple's charts</text>
<text x="470.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your top four, at once,</text>
<text x="470.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">kept for 12 hours</text>
<path d="M635.0 124L654.0 124" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#fa)"/>
<rect x="659.50" y="60.50" width="177.00" height="128.00" rx="4" fill="#1b1b1b" stroke="#ffb03b"/>
<circle cx="685.0" cy="90" r="12" fill="#ffb03b"/>
<text x="685.00" y="94.50" font-size="13" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">4</text>
<text x="675.00" y="130.00" font-size="14" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">Ranked for you</text>
<text x="675.00" y="154.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">in several charts: up</text>
<text x="675.00" y="171.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">gone quiet: down</text>
<text x="440.00" y="222.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="middle" xml:space="preserve">x hides a show for good. The Inbox uses the same signal: shows you play most move up a little.</text>
</svg>
