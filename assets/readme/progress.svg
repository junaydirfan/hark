<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="Your place, never lost. hark saves where you are every 10 seconds while playing, and on pause, seek, switching episodes, quitting, closing the terminal and logging out. Tested: closing the terminal saved the exact second; a kill -9 lost 6 seconds. Coming back rewinds a little for context: 3 seconds after a minute away, 10 after an hour, 20 after a day. Stopping in the last 30 seconds, the outro, marks the episode played.">
<style>
@font-face{font-family:hm;font-weight:400;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:500;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:600;src:url(data:font/woff2;base64,)}
text{font-family:hm,hf,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb03b"/><stop offset="1" stop-color="#ff5f6d"/></linearGradient></defs>
