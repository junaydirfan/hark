<text x="60.00" y="80.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">saved every 10 s</text>
<text x="500.80" y="80.00" font-size="12" font-weight="500" fill="#ececec" text-anchor="middle" xml:space="preserve">you are here</text>
<text x="820.00" y="80.00" font-size="12" font-weight="400" fill="#ffb03b" text-anchor="end" xml:space="preserve">outro</text>
<text x="60.00" y="118.00" font-size="11" font-weight="400" fill="#5b5b5b" text-anchor="start" xml:space="preserve">0:00</text>
<text x="820.00" y="118.00" font-size="11" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">44:51</text>
<rect x="44.50" y="150.50" width="253.33" height="150.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<text x="60.00" y="178.00" font-size="14" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">Nothing to lose</text>
<text x="60.00" y="202.00" font-size="12" font-weight="400" fill="#ececec" text-anchor="start" xml:space="preserve">saved every 10 s, and on</text>
<text x="60.00" y="220.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">pause, seek, switch, quit,</text>
<text x="60.00" y="238.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">a closed terminal, logout</text>
<text x="60.00" y="286.00" font-size="11" font-weight="400" fill="#5b5b5b" text-anchor="start" xml:space="preserve">tested: kill -9 lost 6 s</text>
<rect x="313.83" y="150.50" width="253.33" height="150.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<text x="329.33" y="178.00" font-size="14" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">Smart resume</text>
<text x="329.33" y="202.00" font-size="12" font-weight="400" fill="#ececec" text-anchor="start" xml:space="preserve">back a bit, for context:</text>
<text x="329.33" y="220.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">3 s after a minute away</text>
<text x="329.33" y="238.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">10 s after an hour</text>
<text x="329.33" y="256.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">20 s after a day</text>
<text x="329.33" y="286.00" font-size="11" font-weight="400" fill="#5b5b5b" text-anchor="start" xml:space="preserve">you hear the sentence again</text>
<rect x="583.17" y="150.50" width="253.33" height="150.00" rx="4" fill="#1b1b1b" stroke="#2a2a2a"/>
<text x="598.67" y="178.00" font-size="14" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">Done means done</text>
<text x="598.67" y="202.00" font-size="12" font-weight="400" fill="#ececec" text-anchor="start" xml:space="preserve">stop in the last 30 s and</text>
<text x="598.67" y="220.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">it's marked played;</text>
<text x="598.67" y="238.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">seek back and it isn't</text>
<text x="598.67" y="286.00" font-size="11" font-weight="400" fill="#5b5b5b" text-anchor="start" xml:space="preserve">no 'In progress' forever</text>
</svg>
