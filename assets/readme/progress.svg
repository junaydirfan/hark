<text x="329.33" y="178.00" font-size="14" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">A little rewind</text>
<text x="329.33" y="202.00" font-size="12" font-weight="400" fill="#ececec" text-anchor="start" xml:space="preserve">for context, when you return:</text>
<text x="329.33" y="220.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">3 s after a minute away</text>
