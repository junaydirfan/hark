<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-label="hark picks up where you left off. It saves your place every 10 seconds while playing, and when you pause, seek, switch episodes, quit, close the terminal or log out. Coming back, it rewinds a little for context: 3 seconds after a minute away, 10 after an hour, 20 after a day. Stopping in the last 30 seconds, the outro, counts the episode as played.">
