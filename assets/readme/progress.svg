<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">tested, not promised</text>
<rect x="60.00" y="92.00" width="760.00" height="8.00" fill="#1b1b1b"/>
