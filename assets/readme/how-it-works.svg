<rect x="0.50" y="0.50" width="879.00" height="329.00" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.50" y="26.50" width="831.00" height="277.00" rx="3" fill="none" stroke="#2a2a2a"/>
