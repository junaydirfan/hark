<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="How it works. hark reads public RSS feeds and streams episodes from wherever the show hosts them. One async thread draws the screen and does the networking; audio runs on its own thread: symphonia decodes, Sonic changes the speed without changing the pitch, cpal plays the sound. Feeds, show notes and the stream are cached on disk; your shows, place, queue and downloads are plain files. Media keys come through MPRIS on Linux and Now Playing on macOS. Apple&#x27;s podcast directory is asked only for search, charts and For you.">
<style>
