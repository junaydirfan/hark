<text x="42.00" y="30.50" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start" xml:space="preserve">how it works</text>
<rect x="586.20" y="24.00" width="258.80" height="5.00" fill="#0d0d0d"/>
<text x="851.00" y="30.50" font-size="12" font-weight="400" fill="#5b5b5b" text-anchor="end" xml:space="preserve">no account · no mpv · no analytics</text>
<rect x="52.50" y="58.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="66.00" y="80.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Podcast feeds</text>
<text x="66.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">public RSS, any host</text>
<text x="66.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">asked 'only if changed'</text>
<text x="66.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">8 at a time</text>
<rect x="52.50" y="176.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="66.00" y="198.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Apple directory</text>
<text x="66.00" y="218.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">search, charts, For you:</text>
<text x="66.00" y="235.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">only when you look</text>
<rect x="318.50" y="58.50" width="244.00" height="120.00" rx="4" fill="#1b1b1b" stroke="#ffb03b"/>
<text x="332.00" y="80.00" font-size="13" font-weight="600" fill="#ffb03b" text-anchor="start" xml:space="preserve">hark</text>
<text x="332.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">one async thread:</text>
<text x="332.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">screen + network</text>
<text x="332.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">redraws only on change</text>
<text x="332.00" y="151.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">input sleeps on its own thread</text>
<rect x="318.50" y="200.50" width="244.00" height="68.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="332.00" y="222.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Audio thread</text>
<text x="332.00" y="242.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">symphonia → Sonic → cpal</text>
<text x="332.00" y="259.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">sleeps until it's needed</text>
<rect x="632.50" y="58.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="646.00" y="80.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">On disk</text>
<text x="646.00" y="100.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">your shows as OPML</text>
<text x="646.00" y="117.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">place · queue · downloads</text>
<text x="646.00" y="134.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">feeds + notes cached</text>
<rect x="632.50" y="176.50" width="196.00" height="92.00" rx="4" fill="#0d0d0d" stroke="#2a2a2a"/>
<text x="646.00" y="198.00" font-size="13" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Desktop</text>
<text x="646.00" y="218.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">media keys, widgets,</text>
<text x="646.00" y="235.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">MPRIS · Now Playing</text>
<text x="646.00" y="252.00" font-size="11.5" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">PipeWire · CoreAudio</text>
