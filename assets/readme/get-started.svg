<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Get started in three steps. 1: install hark, one command per system. 2: find shows: press / to search, or open Discover, or paste the path of an OPML file from your old podcast app. 3: listen: Enter plays, Space pauses, [ and ] change the speed.">
<style>
@font-face{font-family:hm;font-weight:400;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:500;src:url(data:font/woff2;base64,)}
@font-face{font-family:hm;font-weight:600;src:url(data:font/woff2;base64,)}
text{font-family:hm,hf,ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
</style>
<defs><marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5b5b5b"/></marker></defs>
<rect x="0.00" y="0.00" width="880.00" height="190.00" rx="6" fill="#0d0d0d"/>
<rect x="0.50" y="0.50" width="879.00" height="189.00" rx="6" fill="none" stroke="#1f1f1f"/>
<rect x="24.50" y="26.50" width="831.00" height="137.00" rx="3" fill="none" stroke="#2a2a2a"/>
<rect x="36.00" y="24.00" width="99.80" height="5.00" fill="#0d0d0d"/>
<text x="42.00" y="30.50" font-size="13" font-weight="500" fill="#8f8f8f" text-anchor="start" xml:space="preserve">get started</text>
<circle cx="64.0" cy="76" r="13" fill="#ffb03b"/>
<text x="64.00" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">1</text>
<text x="88.00" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Install</text>
<text x="88.00" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">one command per system,</text>
<text x="88.00" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">see below</text>
<path d="M291.33333333333337 76L313.33333333333337 76" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#sa)"/>
<circle cx="337.33333333333337" cy="76" r="13" fill="#ffb03b"/>
<text x="337.33" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">2</text>
<text x="361.33" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Find shows</text>
<text x="361.33" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">/ to search, or Discover;</text>
<text x="361.33" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">or paste an OPML file's path</text>
<path d="M564.6666666666667 76L586.6666666666667 76" stroke="#5b5b5b" stroke-width="1.2" fill="none" marker-end="url(#sa)"/>
<circle cx="610.6666666666667" cy="76" r="13" fill="#ffb03b"/>
<text x="610.67" y="81.00" font-size="14" font-weight="600" fill="#0d0d0d" text-anchor="middle" xml:space="preserve">3</text>
<text x="634.67" y="81.00" font-size="15" font-weight="600" fill="#ececec" text-anchor="start" xml:space="preserve">Listen</text>
<text x="634.67" y="106.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">Enter plays, Space pauses,</text>
<text x="634.67" y="124.00" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="start" xml:space="preserve">[ ] changes the speed</text>
</svg>
