<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="What&#x27;s different about hark: Small and quiet: About 13 MB of memory with 9 shows, and 0% CPU while paused. Nothing runs when you&#x27;re not listening.; Its own audio engine: Decoding, speed and sound all happen inside one program: no mpv or VLC to install alongside it.; Private suggestions: For you is worked out on your computer from what you play. Apple only sees the genre charts it asks for.; Any open podcast: Any public RSS feed. No account, no sign-in, and your shows come in and go out as standard OPML.">
