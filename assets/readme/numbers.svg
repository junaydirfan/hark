<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Footprint, measured on an i9-14900HX. Memory (PSS) while streaming an episode: hark 8 MB in all; mpv, tuned down, playing the same episode: 61 MB. hark idle with 8 shows and 3,514 episodes: 10.6 MB; streaming with the cover drawn: 15 to 18 MB. CPU: 0 paused, about 1.3 to 2% playing at 1.5x. A 20.7 MB feed is read in 19 ms; from a link to playing in about 0.6 s.">
