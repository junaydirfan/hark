<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" role="img" aria-label="What hark does, by key: /: Search, every show in Apple&#x27;s directory; o: Discover and For you, charts by genre, picks from your listening; ◔: Picks up where you left off, saved as you listen, a little rewind; [ ]: Speed, pitch kept, 0.5–3×, per show if you like (e); a: A queue that plays on, A plays next, n skips ahead; c: Chapters, from the feed or the MP3 itself; d: Downloads, offline listening, K keeps the newest; z: Sleep timer, 15–60 min or end of episode, fades out; I: Skip intros and outros, set once per show; L: Show notes, clean text, links listed; ▶: Media keys, Linux (MPRIS) and macOS (Now Playing); t: Themes and the mouse, cover art, ? for every key. Plus an Inbox of new episodes, In progress, and OPML import from any podcast app.">
