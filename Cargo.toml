[package]
name = "hark"
version = "0.1.2"
edition = "2024"
description = "Lean terminal podcast player"

[dependencies]
cpal = "0.18"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libsonic = "0.1"
quick-xml = "0.42"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "gzip", "stream"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "signal"] }

# Linux: talk to PulseAudio/PipeWire directly (cpal's own pure-Rust client), not through ALSA.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
libc = "0.2" # malloc_trim / mallopt: hand freed heap back after big feeds
mpris-server = { version = "0.11", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
